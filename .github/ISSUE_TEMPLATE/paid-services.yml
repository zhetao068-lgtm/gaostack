name: 付费服务咨询 / Paid services
description: 咨询部署、迁移或定制 / Ask about setup, migration or customization
title: "[Services] "
body:
  - type: markdown
    attributes:
      value: 此表单会创建公开 Issue。请只描述需求，不要填写密钥、公众号资料、私人联系方式或付款信息。 This form creates a public issue. Keep credentials, account details, private contact details and payment information out of your submission.
  - type: dropdown
    id: service
    attributes:
      label: 服务类别 / Service
      options:
        - 部署与交接 / Setup and handover
        - 稿件迁移 / Draft migration
        - 功能定制 / Custom development
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 希望解决什么问题 / Desired outcome
      description: 请描述使用场景和期望结果。可以使用假数据举例。 Describe your workflow and the outcome you want. Use synthetic examples if needed.
    validations:
      required: true
  - type: input
    id: timeline
    attributes:
      label: 期望时间（选填） / Target timeline (optional)
